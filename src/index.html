<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" type="text/css" href="./assets/styles/main.scss"><!-- do not remove this line! -->
  <title>PEC 2 - Jornadas de Cocina Tradicional - Portada</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
  <div id="modal__reserva" class="modal__reserva" hidden>
    <div class="modal__reserva__content">
      <button class="modal__reserva__close">&times;</button>
      <h3 class="modal__reserva__title">Reserva tu plaza</h3>
      <h4 class="modal__reserva__subtitle">Domingo, 25 de enero de 2026</h4>
      <form name="reserva" method="POST" data-netlify="true" class="modal__reserva__form" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="reserva">
        <input type="text" name="bot-field" style="display:none">
        <label>
          Nombre
          <input type="text" name="name" required />
        </label>

        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Comentarios
          <textarea name="message"></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </div>
  </div>

  <include src="./views/header.html"></include>

  <main class="poster">
    <div class="poster__image"></div>
    <h1 class="poster__title">Sabores que cuentan historias</h1>
    <p class="poster__subtitle">
      Participa en nuestras jornadas de cocina tradicional.
      Charlas, talleres y cursos con chefs locales y expertos.
    </p>
    <div data-modal="modal__reserva">
      <a href="#" data-open-modal class="btn btn-primary">Reserva tu plaza</a>
    </div>
  </main>
  <include src="./views/footer.html"></include>
  <script type="module" src="./assets/scripts/main.js"></script><!-- do not remove this line! -->
</body>

</html>
