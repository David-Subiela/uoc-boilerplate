<div class="speaker-card speaker-card-image-wrapper" data-modal="{{ modal_id }}">
    <img src="{{ image_src }}" alt="{{ image_alt }}"
        class="block w-full h-auto max-w-full my-2.5 mx-auto rounded-lg">
    <h3 class="text-xl font-semibold mt-2">{{ name }}</h3>
    <p class="text-gray-700 text-sm">{{ description }}</p>
</div>
