<div id="modal-reserva" class="modal" hidden>
  <div class="modal-card animate-popup">
    <button data-close-modal
      class="absolute top-3 right-4 text-3xl cursor-pointer text-uoc-accent hover:opacity-70 modal-reserva__close">&times;</button>
    <h3 class="mb-2 font-serif text-2xl text-center sm:text-3xl text-uoc-accent">Reserva tu plaza</h3>
    <h4 class="mb-6 font-sans text-base text-center text-gray-700">Domingo, 25 de enero de 2026</h4>
    <form name="reserva" method="POST" data-netlify="true" class="flex flex-col gap-4" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="reserva">
      <p class="hidden">
        <label>
          Don't fill this out if you're human: <input name="bot-field" />
        </label>
      </p>
      <label class="flex flex-col gap-1.5 font-semibold text-gray-800">
        Nombre
        <input class="form-input" type="text" name="name" required />
      </label>
      <label class="flex flex-col gap-1.5 font-semibold text-gray-800">
        Email
        <input class="form-input" type="email" name="email" required />
      </label>
      <label class="flex flex-col gap-1.5 font-semibold text-gray-800">
        Comentarios
        <textarea class="form-input resize-vertical min-h-[100px]" name="message"></textarea>
      </label>
      <button type="submit" class="btn btn-primary mt-2">Enviar</button>
    </form>
  </div>
</div>
